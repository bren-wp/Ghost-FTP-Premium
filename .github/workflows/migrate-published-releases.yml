name: Audit published release migration

on:
  push:
    branches:
      - release/0x-published-migration-and-hardening
    paths:
      - '.github/scripts/migrate-published-releases.mjs'
      - '.github/workflows/migrate-published-releases.yml'
      - 'docs/releases/version-map.json'

permissions:
  contents: write

concurrency:
  group: ghostftp-published-release-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate migration script syntax
        run: node --check .github/scripts/migrate-published-releases.mjs

      - name: Validate migration plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/migrate-published-releases.mjs

      - name: Report migration authorization boundary
        run: |
          echo "Migration plan is valid."
          echo "Automatic apply is intentionally disabled because this repository's Actions GitHub App cannot create historical tag refs (HTTP 403)."
          echo "The idempotent migrator remains available for an administrator-authorized GitHub token:"
          echo "  node .github/scripts/migrate-published-releases.mjs --apply"
