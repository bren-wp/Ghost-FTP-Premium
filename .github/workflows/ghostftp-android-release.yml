name: Ghost FTP Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag that should receive the Android APK asset
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ghostftp-android-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  android-release-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          SAFE_TAG="${TAG#v}"
          SAFE_TAG="${SAFE_TAG//./-}"
          SAFE_TAG="${SAFE_TAG//_/-}"
          echo "SAFE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android release contract
        shell: bash
        run: bash android/scripts/check-android-contract.sh

      - name: Build Android release APK
        shell: bash
        run: gradle -p android lintRelease lintPreview assembleRelease assemblePreview

      - name: Verify installable preview and unsigned release-check APKs
        shell: bash
        run: |
          set -euo pipefail
          INSTALLABLE="android/app/build/outputs/apk/preview/app-preview.apk"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -s "$INSTALLABLE"
          test -s "$UNSIGNED"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$INSTALLABLE"
          if "$APKSIGNER" verify "$UNSIGNED" >/dev/null 2>&1; then
            echo "Unsigned release-check APK unexpectedly contains a signature." >&2
            exit 1
          fi

          echo "ANDROID_INSTALLABLE_APK=$INSTALLABLE" >> "$GITHUB_ENV"
          echo "ANDROID_UNSIGNED_APK=$UNSIGNED" >> "$GITHUB_ENV"

      - name: Prepare APK asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          APK="dist/android/GhostFTP-Android-${SAFE_TAG}.apk"
          UNSIGNED="dist/android/GhostFTP-Android-${SAFE_TAG}-Release-Unsigned.apk.unsigned"
          cp "$ANDROID_INSTALLABLE_APK" "$APK"
          cp "$ANDROID_UNSIGNED_APK" "$UNSIGNED"
          test -s "$APK"
          test -s "$UNSIGNED"
          sha256sum "$APK" "$UNSIGNED" > "dist/android/GhostFTP-Android-${SAFE_TAG}-SHA256SUMS.txt"

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/android/* --clobber

      - name: Verify mandatory Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="GhostFTP-Android-${SAFE_TAG}.apk"
          UNSIGNED_NAME="GhostFTP-Android-${SAFE_TAG}-Release-Unsigned.apk.unsigned"
          SHA_NAME="GhostFTP-Android-${SAFE_TAG}-SHA256SUMS.txt"
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK_NAME" <<<"$ASSETS"
          grep -Fxq "$UNSIGNED_NAME" <<<"$ASSETS"
          grep -Fxq "$SHA_NAME" <<<"$ASSETS"
