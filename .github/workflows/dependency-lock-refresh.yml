name: Refresh frontend dependency lock

on:
  push:
    branches: ['hardening/rc23-security-reproducibility']
    paths:
      - 'ghostftp-desktop/package.json'
      - '.github/workflows/dependency-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: ghostftp-dependency-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json

      - name: Resolve dependency graph with npm
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

      - name: Verify clean install and production build
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:i18n
          npm run check:ui
          npm run check
          npm run build

      - name: Commit canonical npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostftp-desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          git commit -m "deps: regenerate npm lock after security upgrades"
          git push origin "HEAD:${GITHUB_REF_NAME}"
